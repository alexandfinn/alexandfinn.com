<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="Alex and Finn design and develop thoughtful digital products."
    />
    <title>Alex &amp; Finn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Montserrat:wght@400;500&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #8db0a5;
        --ink: #e8f4f0;
        --muted: #d2e7e0;
        --highlight: #6f9589;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--paper);
      }

      body {
        color: var(--ink);
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 7px;
      }

      ::selection {
        color: var(--paper);
        background: var(--ink);
      }

      main {
        min-height: 100svh;
        padding: clamp(22px, 2.5vw, 40px);
        display: grid;
        place-items: center;
      }

      .intro {
        width: 100%;
        padding: clamp(56px, 9vh, 112px) 0;
        text-align: center;
      }

      h1 {
        margin: 0;
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: clamp(10px, 1.5vw, 26px);
        font-family: "Montserrat", sans-serif;
        font-size: clamp(82px, 13vw, 208px);
        font-weight: 400;
        line-height: 0.78;
        letter-spacing: 0.01em;
      }

      h1 a {
        margin-inline: -0.03em;
        padding-inline: 0.03em;
        background-image: linear-gradient(var(--highlight), var(--highlight));
        background-repeat: no-repeat;
        background-position: left 72%;
        background-size: 0 78%;
        transition: background-size 240ms ease;
      }

      h1 a:hover,
      h1 a:focus-visible {
        background-size: 100% 78%;
      }

      .conjunction {
        color: var(--highlight);
        font-weight: 500;
      }

      .intro > p {
        max-width: 700px;
        margin: clamp(20px, 3vh, 30px) auto 0;
        color: var(--muted);
        font-size: clamp(18px, 1.45vw, 22px);
        line-height: 1.48;
        letter-spacing: -0.025em;
        text-wrap: balance;
      }

      .contact-button {
        width: fit-content;
        height: 42px;
        margin: 36px auto 0;
        padding: 0 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid var(--ink);
        color: var(--ink);
        background: var(--paper);
        font-size: 13px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: 0.04em;
        text-transform: lowercase;
        transition:
          background 150ms ease,
          border-color 150ms ease;
      }

      .contact-button:hover,
      .contact-button:focus-visible {
        background: var(--highlight);
        border-color: var(--ink);
      }

      .contact-button svg {
        width: 16px;
        height: 16px;
        flex: none;
      }

      .pong-toggle {
        position: fixed;
        right: clamp(16px, 2.5vw, 32px);
        bottom: clamp(16px, 2.5vw, 32px);
        z-index: 1002;
        width: 44px;
        height: 44px;
        padding: 0;
        display: grid;
        place-items: center;
        border: 1px solid color-mix(in srgb, var(--ink) 55%, transparent);
        border-radius: 50%;
        color: var(--ink);
        background: color-mix(in srgb, var(--paper) 88%, transparent);
        backdrop-filter: blur(8px);
        cursor: pointer;
        transition:
          background 150ms ease,
          border-color 150ms ease,
          transform 150ms ease;
      }

      .pong-toggle:hover,
      .pong-toggle:focus-visible {
        border-color: var(--ink);
        background: var(--highlight);
        transform: translateY(-2px);
      }

      .pong-toggle:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 4px;
      }

      .pong-toggle svg {
        width: 23px;
        height: 23px;
        stroke-width: 1.75;
      }

      .pong-layer {
        position: fixed;
        inset: 0;
        z-index: 1000;
        overflow: hidden;
        pointer-events: none;
      }

      .pong-layer[hidden] {
        display: none;
      }

      .pong-paddle,
      .pong-ball {
        position: absolute;
        left: 0;
        top: 0;
        will-change: transform;
      }

      .pong-paddle {
        width: 106px;
        height: 10px;
        border-radius: 999px;
        background: var(--ink);
        box-shadow: 0 0 22px color-mix(in srgb, var(--ink) 36%, transparent);
      }

      .pong-ball {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--ink);
        box-shadow: 0 0 18px color-mix(in srgb, var(--ink) 45%, transparent);
        transition: opacity 120ms ease;
      }

      .pong-ball.is-waiting {
        opacity: 0;
      }

      .pong-hint {
        position: absolute;
        top: clamp(16px, 2.5vw, 28px);
        left: 50%;
        color: color-mix(in srgb, var(--ink) 68%, transparent);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transform: translateX(-50%);
      }

      .pong-impact {
        position: absolute;
        left: 0;
        top: 0;
        width: 14px;
        height: 14px;
        border: 1px solid var(--ink);
        border-radius: 50%;
        animation: pong-impact 260ms ease-out forwards;
      }

      .pong-destroyed {
        pointer-events: none !important;
        transform-origin: center;
        animation: pong-destroy 640ms cubic-bezier(0.22, 0.68, 0.3, 1) forwards;
      }

      @keyframes pong-destroy {
        0% {
          opacity: 1;
          transform: translate3d(0, 0, 0) rotate(0) scale(1);
        }
        24% {
          opacity: 1;
          transform: translate3d(var(--pong-kick-x), -17px, 0)
            rotate(var(--pong-kick-rotation)) scale(1.04);
        }
        100% {
          opacity: 0;
          transform: translate3d(var(--pong-drift), 118px, 0)
            rotate(var(--pong-rotation)) scale(0.92);
        }
      }

      @keyframes pong-impact {
        from {
          opacity: 0.9;
          transform: translate3d(var(--impact-x), var(--impact-y), 0) scale(0.45);
        }
        to {
          opacity: 0;
          transform: translate3d(var(--impact-x), var(--impact-y), 0) scale(3);
        }
      }

      .pong-word,
      .pong-letter {
        display: inline-block;
      }

      body.pong-active {
        touch-action: none;
        user-select: none;
      }

      body.pong-active .pong-toggle {
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
      }

      .breakout-win {
        position: fixed;
        inset: 0;
        z-index: 1004;
        padding: 20px;
        display: grid;
        place-items: center;
        background: color-mix(in srgb, var(--paper) 68%, transparent);
        backdrop-filter: blur(10px);
      }

      .breakout-win[hidden] {
        display: none;
      }

      .breakout-card {
        position: relative;
        width: min(360px, 100%);
        padding: 34px;
        border: 1px solid var(--ink);
        color: var(--paper);
        background: var(--ink);
        text-align: center;
        box-shadow: 0 20px 60px color-mix(in srgb, var(--highlight) 36%, transparent);
      }

      .breakout-close {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        color: inherit;
        background: transparent;
        font: inherit;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
      }

      .breakout-card h2 {
        margin: 0;
        font-family: "Montserrat", sans-serif;
        font-size: 32px;
        font-weight: 400;
        letter-spacing: -0.03em;
      }

      .breakout-email {
        min-height: 42px;
        margin-top: 24px;
        padding: 0 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--paper);
        color: var(--paper);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: lowercase;
        transition:
          color 150ms ease,
          background 150ms ease;
      }

      .breakout-email:hover,
      .breakout-email:focus-visible {
        color: var(--ink);
        background: var(--paper);
      }

      @media (max-width: 620px) {
        main {
          padding: 18px;
        }

        .intro {
          padding: 40px 0;
        }

        h1 {
          flex-wrap: nowrap;
          gap: 5px;
          font-size: clamp(48px, 13.8vw, 84px);
          line-height: 0.9;
        }

        .intro > p {
          max-width: 32ch;
          margin-top: 18px;
          font-size: 16px;
          line-height: 1.5;
          letter-spacing: -0.015em;
        }

        .contact-button {
          height: 44px;
          margin-top: 26px;
          padding-inline: 20px;
        }

        .pong-paddle {
          width: 82px;
          height: 8px;
        }

        .pong-hint {
          font-size: 9px;
        }
      }

      @media (max-width: 380px) {
        main {
          padding: 16px;
        }

        h1 {
          gap: 4px;
          font-size: max(43px, 13.5vw);
        }
      }

      @media (max-height: 620px) and (min-width: 621px) {
        .intro {
          padding-block: 30px;
        }

        h1 {
          font-size: clamp(72px, 11vw, 150px);
        }

        .intro > p {
          margin-top: 18px;
        }

        .contact-button {
          margin-top: 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
        }

        .pong-destroyed,
        .pong-impact {
          animation-duration: 180ms;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="intro" aria-labelledby="intro-heading">
        <h1 id="intro-heading">
          <a
            href="https://www.linkedin.com/in/alexanderassmann/"
            target="_blank"
            rel="noreferrer"
            aria-label="Alex Assmann on LinkedIn (opens in a new tab)"
            ><span class="pong-letter" data-pong-target>a</span><span
              class="pong-letter"
              data-pong-target
              >l</span
            ><span class="pong-letter" data-pong-target>e</span><span
              class="pong-letter"
              data-pong-target
              >x</span
            ></a
          >
          <span class="conjunction" data-pong-target aria-hidden="true">&amp;</span>
          <a
            href="https://www.linkedin.com/in/finnpauls/"
            target="_blank"
            rel="noreferrer"
            aria-label="Finn Pauls on LinkedIn (opens in a new tab)"
            ><span class="pong-letter" data-pong-target>f</span><span
              class="pong-letter"
              data-pong-target
              >i</span
            ><span class="pong-letter" data-pong-target>n</span><span
              class="pong-letter"
              data-pong-target
              >n</span
            ></a
          >
        </h1>

        <p>
          <span class="pong-word" data-pong-target>We</span>
          <span class="pong-word" data-pong-target>design</span>
          <span class="pong-word" data-pong-target>and</span>
          <span class="pong-word" data-pong-target>develop</span>
          <span class="pong-word" data-pong-target>thoughtful</span>
          <span class="pong-word" data-pong-target>digital</span>
          <span class="pong-word" data-pong-target>products.</span>
          <span class="pong-word" data-pong-target>From</span>
          <span class="pong-word" data-pong-target>first</span>
          <span class="pong-word" data-pong-target>idea</span>

        <a

          >

    </main>

    <button
      class="pong-toggle"
      type="button"
      aria-label="Start destroy-the-site Pong"
      aria-controls="pong-game"
    >
      <svg
        class="lucide lucide-gamepad-2"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <line x1="6" x2="10" y1="11" y2="11" />
        <line x1="8" x2="8" y1="9" y2="13" />
        <line x1="15" x2="15.01" y1="12" y2="12" />
        <line x1="18" x2="18.01" y1="10" y2="10" />
        <path
          d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"
        />
      </svg>

    <div class="pong-layer" id="pong-game" aria-hidden="true" hidden>
      <div class="pong-hint">Esc to exit</div>
      <div class="pong-paddle"></div>
      <div class="pong-ball"></div>
    </div>

    <div class="breakout-win" hidden>
      <section
        class="breakout-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="breakout-title"
      >
        <button class="breakout-close" type="button" aria-label="Close">×</button>
        <h2 id="breakout-title">You made it.</h2>
        <a
          class="breakout-email"
          href="mailto:breakout@alexandfinn.com?subject=I%20made%20it!&amp;body=Hi%20Alex%20and%20Finn%2C%0A%0AI%20finished%20the%20breakout%20game!"
          >let us know</a
        >
      </section>
    </div>

    <script>
      (() => {
        const toggle = document.querySelector(".pong-toggle");
        const layer = document.querySelector(".pong-layer");
        const paddle = document.querySelector(".pong-paddle");
        const ball = document.querySelector(".pong-ball");
        const winModal = document.querySelector(".breakout-win");
        const winCard = document.querySelector(".breakout-card");
        const closeWin = document.querySelector(".breakout-close");
        const emailWin = document.querySelector(".breakout-email");
        const targets = [...document.querySelectorAll("[data-pong-target]")];
        const originalAria = new Map(
          targets.map((target) => [target, target.getAttribute("aria-hidden")]),
        );

        const ballRadius = 8;
        let active = false;
        let paused = false;
        let animationFrame;
        let restartTimer;
        let completionTimer;
        let lastTime = 0;
        let ballX = 0;
        let ballY = 0;
        let velocityX = 0;
        let velocityY = 0;
        let paddleX = 0;
        let hitTargets = new Set();

        const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

        function paddleMetrics() {
          return {
            width: paddle.offsetWidth,
            height: paddle.offsetHeight,
            y:
              window.innerHeight -
              Math.max(24, window.innerHeight * 0.035) -
              paddle.offsetHeight,
          };
        }

        function movePaddle(clientX) {
          const { width, y } = paddleMetrics();
          paddleX = clamp(clientX - width / 2, 8, window.innerWidth - width - 8);
          paddle.style.transform = `translate3d(${paddleX}px, ${y}px, 0)`;
        }

        function renderBall() {
          ball.style.transform = `translate3d(${ballX - ballRadius}px, ${ballY - ballRadius}px, 0)`;
        }

        function makeImpact(x, y) {
          const impact = document.createElement("i");
          impact.className = "pong-impact";
          impact.style.setProperty("--impact-x", `${x - ballRadius + 1}px`);
          impact.style.setProperty("--impact-y", `${y - ballRadius + 1}px`);
          layer.appendChild(impact);
          impact.addEventListener("animationend", () => impact.remove(), {
            once: true,
          });
        }

        function smashTarget(target) {
          hitTargets.add(target);
          const rotation =
            (Math.random() < 0.5 ? -1 : 1) * (24 + Math.random() * 34);
          const drift = (Math.random() - 0.5) * 56;
          target.style.setProperty("--pong-kick-x", `${drift * 0.18}px`);
          target.style.setProperty("--pong-kick-rotation", `${rotation * 0.16}deg`);
          target.style.setProperty("--pong-drift", `${drift}px`);
          target.style.setProperty("--pong-rotation", `${rotation}deg`);
          target.classList.add("pong-destroyed");
          target.setAttribute("aria-hidden", "true");
          makeImpact(ballX, ballY);

          if (hitTargets.size === targets.length) {
            completionTimer = setTimeout(() => {
              if (!active) return;
              stop();
              winModal.hidden = false;
              emailWin.focus();
            }, 700);
          }
        }

        function checkTargets() {
          for (const target of targets) {
            if (hitTargets.has(target)) continue;
            const rect = target.getBoundingClientRect();
            if (
              ballX + ballRadius >= rect.left &&
              ballX - ballRadius <= rect.right &&
              ballY + ballRadius >= rect.top &&
              ballY - ballRadius <= rect.bottom
            ) {
              smashTarget(target);

              const overlaps = [
                { side: "left", amount: ballX + ballRadius - rect.left },
                { side: "right", amount: rect.right - (ballX - ballRadius) },
                { side: "top", amount: ballY + ballRadius - rect.top },
                { side: "bottom", amount: rect.bottom - (ballY - ballRadius) },
              ];
              const collision = overlaps.reduce((nearest, overlap) =>
                overlap.amount < nearest.amount ? overlap : nearest,
              );

              if (collision.side === "left") {
                ballX = rect.left - ballRadius;
                velocityX = -Math.abs(velocityX);
              } else if (collision.side === "right") {
                ballX = rect.right + ballRadius;
                velocityX = Math.abs(velocityX);
              } else if (collision.side === "top") {
                ballY = rect.top - ballRadius;
                velocityY = -Math.abs(velocityY);
              } else {
                ballY = rect.bottom + ballRadius;
                velocityY = Math.abs(velocityY);
              }

              return;
            }
          }
        }

        function resetBall() {
          if (!active) return;
          paused = false;
          ball.classList.remove("is-waiting");
          const metrics = paddleMetrics();
          ballX = paddleX + metrics.width / 2;
          ballY = metrics.y - ballRadius - 3;
          const speed = clamp(window.innerWidth * 0.34, 270, 430);
          velocityX = (Math.random() - 0.5) * speed * 0.8;
          velocityY = -Math.sqrt(speed ** 2 - velocityX ** 2);
          renderBall();
        }

        function miss() {
          paused = true;
          ball.classList.add("is-waiting");
          clearTimeout(restartTimer);
          restartTimer = setTimeout(resetBall, 650);
        }

        function frame(time) {
          if (!active) return;
          const delta = Math.min((time - lastTime) / 1000, 0.032) || 0;
          lastTime = time;

          if (!paused) {
            const previousY = ballY;
            ballX += velocityX * delta;
            ballY += velocityY * delta;

            if (ballX <= ballRadius) {
              ballX = ballRadius;
              velocityX = Math.abs(velocityX);
            } else if (ballX >= window.innerWidth - ballRadius) {
              ballX = window.innerWidth - ballRadius;
              velocityX = -Math.abs(velocityX);
            }

            if (ballY <= ballRadius) {
              ballY = ballRadius;
              velocityY = Math.abs(velocityY);
            }

            const metrics = paddleMetrics();
            const touchesPaddle =
              velocityY > 0 &&
              previousY + ballRadius <= metrics.y + metrics.height &&
              ballY + ballRadius >= metrics.y &&
              ballX >= paddleX - ballRadius &&
              ballX <= paddleX + metrics.width + ballRadius;

            if (touchesPaddle) {
              const impact = clamp(
                (ballX - (paddleX + metrics.width / 2)) / (metrics.width / 2),
                -1,
                1,
              );
              const speed = Math.min(Math.hypot(velocityX, velocityY) * 1.045, 620);
              const angle = impact * 0.95;
              ballY = metrics.y - ballRadius;
              velocityX = Math.sin(angle) * speed;
              velocityY = -Math.cos(angle) * speed;
            } else if (ballY - ballRadius > window.innerHeight) {
              miss();
            }

            checkTargets();
            renderBall();
          }

          animationFrame = requestAnimationFrame(frame);
        }

        function restoreTargets() {
          for (const target of targets) {
            target.classList.remove("pong-destroyed");
            target.style.removeProperty("--pong-kick-x");
            target.style.removeProperty("--pong-kick-rotation");
            target.style.removeProperty("--pong-drift");
            target.style.removeProperty("--pong-rotation");
            const aria = originalAria.get(target);
            if (aria === null) target.removeAttribute("aria-hidden");
            else target.setAttribute("aria-hidden", aria);
          }
        }

        function hideWin() {
          winModal.hidden = true;
          toggle.focus();
        }

        function start() {
          if (active) return;
          winModal.hidden = true;
          active = true;
          hitTargets = new Set();
          restoreTargets();
          document.body.classList.add("pong-active");
          layer.hidden = false;
          layer.setAttribute("aria-hidden", "false");
          movePaddle(window.innerWidth / 2);
          resetBall();
          lastTime = performance.now();
          animationFrame = requestAnimationFrame(frame);
        }

        function stop() {
          if (!active) return;
          active = false;
          paused = false;
          cancelAnimationFrame(animationFrame);
          clearTimeout(restartTimer);
          clearTimeout(completionTimer);
          document.body.classList.remove("pong-active");
          layer.hidden = true;
          layer.setAttribute("aria-hidden", "true");
          layer.querySelectorAll(".pong-impact").forEach((impact) => impact.remove());
          restoreTargets();
        }

        toggle.addEventListener("click", start);
        closeWin.addEventListener("click", hideWin);
        winModal.addEventListener("click", (event) => {
          if (!winCard.contains(event.target)) hideWin();
        });

        window.addEventListener("pointermove", (event) => {
          if (active) movePaddle(event.clientX);
        });

        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !winModal.hidden) {
            hideWin();
            return;
          }
          if (!active) return;
          if (event.key === "Escape") {
            stop();
            toggle.focus();
            return;
          }
          if (["ArrowLeft", "ArrowRight", "a", "A", "d", "D"].includes(event.key)) {
            event.preventDefault();
            const direction = ["ArrowLeft", "a", "A"].includes(event.key) ? -1 : 1;
            movePaddle(paddleX + paddleMetrics().width / 2 + direction * 42);
          }
        });

        window.addEventListener("resize", () => {
          if (!active) return;
          movePaddle(paddleX + paddleMetrics().width / 2);
          ballX = clamp(ballX, ballRadius, window.innerWidth - ballRadius);
          ballY = clamp(ballY, ballRadius, window.innerHeight - ballRadius);
          renderBall();
        });

        document.addEventListener("visibilitychange", () => {
          lastTime = performance.now();
        });
      })();
    </script>
  </body>
</html>
