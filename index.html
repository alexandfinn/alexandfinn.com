<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="Alex and Finn design and develop thoughtful digital products."
    />
    <title>Alex &amp; Finn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Montserrat:wght@400;500&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #8db0a5;
        --ink: #e8f4f0;
        --muted: #d2e7e0;
        --highlight: #6f9589;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--paper);
      }

      body {
        color: var(--ink);
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 7px;
      }

      ::selection {
        color: var(--paper);
        background: var(--ink);
      }

      main {
        min-height: 100svh;
        padding: clamp(22px, 2.5vw, 40px);
        display: grid;
        place-items: center;
      }

      .intro {
        width: 100%;
        padding: clamp(56px, 9vh, 112px) 0;
        text-align: center;
      }

      h1 {
        margin: 0;
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: clamp(10px, 1.5vw, 26px);
        font-family: "Montserrat", sans-serif;
        font-size: clamp(82px, 13vw, 208px);
        font-weight: 400;
        line-height: 0.78;
        letter-spacing: 0.01em;
      }

      h1 a {
        margin-inline: -0.03em;
        padding-inline: 0.03em;
        background-image: linear-gradient(var(--highlight), var(--highlight));
        background-repeat: no-repeat;
        background-position: left 72%;
        background-size: 0 78%;
        transition: background-size 240ms ease;
      }

      h1 a:hover,
      h1 a:focus-visible {
        background-size: 100% 78%;
      }

      .conjunction {
        color: var(--highlight);
        font-weight: 500;
      }

      .intro > p {
        max-width: 700px;
        margin: clamp(20px, 3vh, 30px) auto 0;
        color: var(--muted);
        font-size: clamp(18px, 1.45vw, 22px);
        line-height: 1.48;
        letter-spacing: -0.025em;
        text-wrap: balance;
      }

      .contact-button {
        width: fit-content;
        height: 42px;
        margin: 36px auto 0;
        padding: 0 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid var(--ink);
        color: var(--ink);
        background: var(--paper);
        font-size: 13px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: 0.04em;
        text-transform: lowercase;
        transition:
          background 150ms ease,
          border-color 150ms ease;
      }

      .contact-button:hover,
      .contact-button:focus-visible {
        background: var(--highlight);
        border-color: var(--ink);
      }

      .contact-button svg {
        width: 16px;
        height: 16px;
        flex: none;
      }

      @media (max-width: 620px) {
        main {
          padding: 18px;
        }

        .intro {
          padding: 40px 0;
        }

        h1 {
          flex-wrap: nowrap;
          gap: 5px;
          font-size: clamp(48px, 13.8vw, 84px);
          line-height: 0.9;
        }

        .intro > p {
          max-width: 32ch;
          margin-top: 18px;
          font-size: 16px;
          line-height: 1.5;
          letter-spacing: -0.015em;
        }

        .contact-button {
          height: 44px;
          margin-top: 26px;
          padding-inline: 20px;
        }
      }

      @media (max-width: 380px) {
        main {
          padding: 16px;
        }

        h1 {
          gap: 4px;
          font-size: max(43px, 13.5vw);
        }
      }

      @media (max-height: 620px) and (min-width: 621px) {
        .intro {
          padding-block: 30px;
        }

        h1 {
          font-size: clamp(72px, 11vw, 150px);
        }

        .intro > p {
          margin-top: 18px;
        }

        .contact-button {
          margin-top: 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="intro" aria-labelledby="intro-heading">
        <h1 id="intro-heading">
          <a
            href="https://www.linkedin.com/in/alexanderassmann/"
            target="_blank"
            rel="noreferrer"
            aria-label="Alex Assmann on LinkedIn (opens in a new tab)"
            >alex</a
          >
          <span class="conjunction" aria-hidden="true">&amp;</span>
          <a
            href="https://www.linkedin.com/in/finnpauls/"
            target="_blank"
            rel="noreferrer"
            aria-label="Finn Pauls on LinkedIn (opens in a new tab)"
            >finn</a
          >
        </h1>

        <p>
          We design and develop thoughtful digital products. From first idea to
          shipped in production.
        </p>

        <a class="contact-button" href="mailto:alexandfinn@karugamo.agency">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect width="20" height="16" x="2" y="4" rx="2" />
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
          </svg>
          <span>talk to us</span>
        </a>
      </section>
    </main>
  </body>
</html>
